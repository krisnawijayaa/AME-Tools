<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — AME Toolbox</title>
<meta name="theme-color" content="#0f1117" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    color: #eef1f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .box { max-width: 320px; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #9aa3b5; line-height: 1.5; margin: 0 0 20px; }
  a {
    display: inline-block;
    background: #3a8dff;
    color: #fff;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Page not cached yet</h1>
    <p>Halaman ini belum pernah dibuka saat online, jadi belum tersedia offline. Tool lain yang sudah pernah dibuka tetap bisa dipakai.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
