<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Electrical Converter — AME Toolbox</title>
<meta name="theme-color" content="#0f1117" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="topbar">
    <a class="back-btn" href="../index.html" aria-label="Back">
      <i data-lucide="arrow-left" style="width:18px;height:18px"></i>
    </a>
    <h1 id="pageTitle">Voltage Converter</h1>
  </div>

  <div class="tabs" id="modeTabs"></div>

  <div id="converterMode">
    <div class="type-selector" id="typeSelector"></div>
    <div class="converter-list fade-in" id="converterList"></div>
  </div>

  <div id="calcMode" class="fade-in hidden">
    <div id="calcPanel"></div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="../index.html">
      <i data-lucide="home" style="width:20px;height:20px"></i>
      Home
    </a>
    <a class="nav-item" href="measurement.html">
      <i data-lucide="ruler" style="width:20px;height:20px"></i>
      Measure
    </a>
    <a class="nav-item" href="torque.html">
      <i data-lucide="wrench" style="width:20px;height:20px"></i>
      Torque
    </a>
    <a class="nav-item active" href="electrical.html">
      <i data-lucide="zap" style="width:20px;height:20px"></i>
      Electrical
    </a>
    <a class="nav-item" href="general.html">
      <i data-lucide="calculator" style="width:20px;height:20px"></i>
      General
    </a>
  </nav>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../data/units.js"></script>
  <script src="../data/aliases.js"></script>
  <script src="../js/favorites.js"></script>
  <script src="../js/history.js"></script>
  <script src="../js/converter-core.js"></script>
  <script src="../js/electrical-calc.js"></script>
  <script src="../js/electrical.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../service-worker.js", { scope: "../" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
