<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Scientific Calculator — AME Toolbox</title>
<meta name="theme-color" content="#0f1117" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="topbar">
    <a class="back-btn" href="general.html" aria-label="Back">
      <i data-lucide="arrow-left" style="width:18px;height:18px"></i>
    </a>
    <h1>Scientific Calculator</h1>
  </div>

  <div class="panel calc-display">
    <div class="calc-memory" id="calcMemory"></div>
    <div class="calc-expr" id="calcExpr">0</div>
    <div class="calc-display-actions">
      <button class="chip" onclick="copyResult()"><i data-lucide="copy" style="width:14px;height:14px"></i> Copy</button>
    </div>
  </div>

  <div class="calc-keypad" id="calcKeypad"></div>

  <div id="calcInfoPanel" style="margin:0 16px;"></div>

  <section class="section">
    <div class="section-title">
      <h2>History</h2>
      <button class="chip" onclick="clearAllHistory()" style="padding:6px 12px;">Clear All</button>
    </div>
    <div class="tool-list" id="calcHistoryList"></div>
  </section>

  <nav class="bottom-nav">
    <a class="nav-item" href="../index.html">
      <i data-lucide="home" style="width:20px;height:20px"></i>
      Home
    </a>
    <a class="nav-item" href="measurement.html">
      <i data-lucide="ruler" style="width:20px;height:20px"></i>
      Measure
    </a>
    <a class="nav-item" href="torque.html">
      <i data-lucide="wrench" style="width:20px;height:20px"></i>
      Torque
    </a>
    <a class="nav-item" href="electrical.html">
      <i data-lucide="zap" style="width:20px;height:20px"></i>
      Electrical
    </a>
    <a class="nav-item active" href="general.html">
      <i data-lucide="calculator" style="width:20px;height:20px"></i>
      General
    </a>
  </nav>

  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script defer src="../js/toast.js"></script>
  <script defer src="../js/ripple.js"></script>
  <script defer src="../data/tool-info.js"></script>
  <script defer src="../js/favorites.js"></script>
  <script defer src="../js/history.js"></script>
  <script defer src="../js/settings.js"></script>
  <script defer src="../js/converter-core.js"></script>
  <script defer src="../js/tool-info.js"></script>
  <script defer src="../js/calc-history.js"></script>
  <script defer src="../js/calculator.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.History.add("scientific-calculator");
    });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../service-worker.js", { scope: "../" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
