<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>General Tools — AME Toolbox</title>
<meta name="theme-color" content="#0f1117" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../assets/icons/icon-192.png" />

<link rel="stylesheet" href="../css/main.css" />

<body>

  <div class="topbar">
    <a class="back-btn" href="../index.html" aria-label="Back">

    </a>
    <h1>General</h1>
  </div>

  <div class="type-selector" id="tabs"></div>

  <div id="dec2fracPanel" class="fade-in"></div>
  <div id="frac2decPanel" class="fade-in hidden"></div>
  <div id="basePanel" class="fade-in hidden"></div>
  <div id="percentagePanel" class="fade-in hidden"></div>

  <div id="scinotationPanel" class="fade-in hidden"></div>
  <div id="datediffPanel" class="fade-in hidden"></div>
  <div id="timePanel" class="fade-in hidden"></div>

    <div class="tool-list">
      <a class="tool-row" href="calculator.html">
        <div class="t-icon accent-purple"><i data-lucide="calculator" style="width:18px;height:18px"></i></div>

    <a class="nav-item" href="../index.html">

      <i data-lucide="zap" style="width:20px;height:20px"></i>

    <a class="nav-item active" href="general.html">
      <i data-lucide="calculator" style="width:20px;height:20px"></i>

  <script src="../data/units.js"></script>
  <script src="../data/aliases.js"></script>
  <script src="../js/favorites.js"></script>
  <script src="../js/history.js"></script>
  <script src="../js/converter-core.js"></script>

  <script src="../js/general.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../service-worker.js", { scope: "../" }).catch(() => {});
      });
    }
  </script>
